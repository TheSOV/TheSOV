# Rebuilds the contribution level once a day and publishes it on the `output` branch as a single
# orphan commit. Any failure (GraphQL error, unexpected shape, SVG check) stops before the push,
# so the profile keeps showing yesterday's level.
name: level

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: level
  cancel-in-progress: false

jobs:
  level:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the level from the real calendar
        run: node src/level/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}

      - name: Check it before publishing
        run: node src/svg/check.mjs out/level.svg

      - name: Publish to the output branch
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add level.svg
          git commit -q -m "level $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" output
